server.port=8080
server.tomcat.max-swallow-size=64KB
spring.servlet.multipart.max-file-size=64KB
spring.servlet.multipart.max-request-size=64KB
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/planly}
spring.datasource.username=${DB_USER:planly}
spring.datasource.password=${DB_PASSWORD:planly}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
